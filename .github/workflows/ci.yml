name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Cancel superseded runs on the same branch/PR so pushing a fix doesn't queue
# behind a run that's already obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Formatting first: cheapest check, and AGENTS.md's own per-PR gate
      # runs it before the others.
      - name: cargo fmt --check
        run: cargo fmt --check --all

      # --lib, not --all-targets: AGENTS.md holds measurement binaries and
      # test harnesses to a looser bar than the library code itself.
      - name: cargo clippy
        run: cargo clippy --release --workspace --lib -- -D warnings -D clippy::pedantic

      - name: cargo test
        run: cargo test --release --workspace

  rfc-check:
    name: rfc.py check
    runs-on: ubuntu-latest
    steps:
      # `docs` (ADR-0051) is the public `metel-docs` repo -- a plain,
      # unauthenticated HTTPS submodule checkout works, no token needed.
      # Before ADR-0051 this pulled a private submodule (metel-docs-internal)
      # and needed DOCS_REPO_TOKEN's SSH-to-HTTPS rewrite; that credential and
      # this dance are both gone now that the submodule itself is public.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # A rigor block's `blocked` exemption (ADR-0050 §6) that names a GitHub
      # issue gets checked live against the issues API here -- needs no
      # secret (a single-issue GET on a public repo is anonymous-readable);
      # GITHUB_TOKEN only raises the request above the unauthenticated rate
      # limit. Degrades to skipping that one ref, never to a failure, if the
      # request can't be made at all -- only a *confirmed* closed blocker
      # fails this job.
      - name: rfc.py check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 docs/rfcs/tools/rfc.py check

  grammar-doc-check:
    name: grammar.md up to date
    runs-on: ubuntu-latest
    steps:
      # metel-core#720: docs/reference/spec/grammar.md is generated from
      # metel-frontend/src/grammar.pest + grammar-doc.toml, not hand-written
      # -- gen_grammar --check fails if the checked-in file doesn't match a
      # fresh generation (drift), or if grammar.pest and grammar-doc.toml
      # disagree about which rules exist (a new pest rule with no sidecar
      # entry, or a stale entry naming a rule that's gone).
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: gen_grammar --check
        run: cargo run --release --bin gen_grammar -- --check
        working-directory: metel-frontend

  stdlib-doc-check:
    name: runtime.md matches stdlib declarations
    runs-on: ubuntu-latest
    steps:
      # metel-core#718: checks docs/reference/spec/runtime.md's builtin and
      # method tables against stdlib/*.mtl's real declarations, in both
      # directions -- a documented row with no matching declaration, a real
      # public declaration missing from its table, or a row whose signature
      # doesn't match (#714/#717's actual historical bugs: a documented
      # calling form -- method vs. free function -- that never existed, and
      # a phantom function with no declaration at all).
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: check_stdlib_docs
        run: cargo run --release --bin check_stdlib_docs
        working-directory: metel-frontend

  doc-examples:
    name: doc examples
    runs-on: ubuntu-latest
    steps:
      # `docs` (ADR-0051) is the public `metel-docs` repo -- same
      # unauthenticated submodule checkout as rfc-check, above.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build metel
        run: cargo build --release -p metel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Checks README.md plus whatever commit the docs submodule is
      # currently pinned to -- not necessarily metel-docs's latest main.
      # metel-docs has its own copy of this workflow that checks its own
      # current main against the latest release binary, so a broken example
      # there is caught immediately rather than waiting for this repo's
      # submodule pointer to move.
      #
      # The paths are the *directory* getting-started and the *directory*
      # reference, not their `tutorials`/`spec` subdirectories -- narrower
      # paths silently excluded three files that read as ordinary working
      # Metel: getting-started/quickstart.mdx and intro.mdx (siblings of
      # `tutorials/`, not inside it), reference/error-codes.md (a sibling of
      # `spec/`), and the blog, which wasn't listed at all. Two real,
      # uncompilable examples shipped to production through exactly that gap
      # -- quickstart's `public fun greet` missing its `-> ()` return type,
      # and the blog post declaring a non-aspect method inside `extend
      # Person: Greet` -- both found by hand, neither reachable by this job
      # as it was configured (metel-core#693).
      #
      # release-notes/ and rfcs/ stay deliberately excluded; see
      # PROCESSES.md § "What is deliberately not checked" for why neither is
      # a gap to close later.
      - name: check doc examples
        run: |
          python3 tools/check_doc_examples.py --binary target/release/metel \
            README.md \
            docs/getting-started \
            docs/blog \
            docs/reference

  # metel-core#696: metel-docs' and metel-website's own doc-example checkers
  # validated against the latest *stable release* binary, while AGENTS.md's
  # Branch Workflow requires documenting a language-visible change the
  # moment it lands on `develop` -- so a feature documented the day it
  # merges could not be checked for real until the *next release*, and the
  # only available escape hatch (`skip`/`expect-fail`) is permanent, with
  # nothing prompting removal once the release catches up. Considered
  # building `develop` from source in both downstream repos' own CI instead
  # (rejected: doubles their PR latency by the ~2 minutes this job's own
  # `cargo build --release -p metel` step already costs, on every PR, in
  # two more repos) and a `since="X.Y.Z"` doc-example marker compared
  # against the binary's own `--version` (rejected for now: real design
  # surface of its own -- a new marker kind, version-comparison logic --
  # and worth revisiting only if this approach turns out not to be enough
  # in practice).
  #
  # This job pays the one build metel-core's own `doc-examples` job already
  # pays for anyway, once per push to `develop` (not per PR -- pushes to
  # `develop` are far rarer than PRs), and republishes it as a rolling
  # pre-release (tag `develop-latest`, overwritten every push) that
  # metel-docs/metel-website download exactly the way they already download
  # the latest *stable* release today -- their own CI cost doesn't change
  # at all. This also fully closes the gap #696 identifies rather than
  # working around it: every doc example is checked against what `develop`
  # can actually run right now, permanently, with no exemption vocabulary
  # ever needed for a develop-only feature.
  publish-develop-binary:
    name: publish rolling develop binary
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build metel
        run: cargo build --release -p metel

      - name: package the binary
        run: |
          cp target/release/metel metel-linux-x86_64
          sha256sum metel-linux-x86_64 > metel-linux-x86_64.sha256

      # `develop-latest` is a rolling tag, not a real release: deleted and
      # recreated on every push rather than updated in place, so the tag
      # always points at the exact commit (`--target`) that produced the
      # binary attached to it -- an in-place asset overwrite would leave
      # the tag pointing at whatever commit first created it. Known,
      # accepted cost: for the few seconds between delete and recreate, a
      # consumer job that happens to run in that exact window sees no
      # `develop-latest` release at all and fails; pushes straight to
      # `develop` are rare enough, and a failed consumer job cheap enough
      # to retry, that building the extra machinery to close that window
      # (keep the release and only swap assets, force-move the tag
      # separately) isn't worth it unless this turns out to bite in
      # practice.
      - name: publish rolling develop-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete develop-latest --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create develop-latest \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "develop (rolling build)" \
            --notes "Automated rolling build of \`develop\`@${{ github.sha }}. Not a stable release -- overwritten on every push to \`develop\` and may change or disappear without notice. Published so metel-docs' and metel-website's doc-example checkers can validate against current \`develop\` behavior without either repo paying a full build on every PR (metel-core#696)." \
            metel-linux-x86_64 metel-linux-x86_64.sha256

  inventory:
    name: inventory doc up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guards only this repo's own slice of PROCESSES.md (metel-core#687) --
      # see the script's own header for why metel-docs's and metel-website's
      # workflows aren't checkable from here.
      - name: check PROCESSES.md lists every workflow/script/command
        run: tools/check_inventory.sh

  clippy-allow-ratchet:
    name: clippy-allow ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure file scan, no Rust toolchain: fails the PR if it adds a bare
      # #[allow(clippy::...)] beyond tools/clippy-allow-baseline.json, or any
      # new module-level #![allow(clippy::...)]. See AGENTS.md 'Clippy
      # suppressions' and metel-core#882.
      - name: clippy suppressions not accumulating
        run: tools/clippy_allow_ratchet.py --check

  resolution-freeze-check:
    name: no post-freeze semantic name lookup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure file scan, no Rust toolchain: the structural backstop ADR-0054
      # step 9 / metel-core#1054 calls for -- fails the PR if the frozen IR or
      # the durable ResolutionMap grows a HashMap/BTreeMap field keyed by
      # String/Span without a `// resolution-freeze-allow: <reason>` comment.
      - name: frozen IR / ResolutionMap carry no String/Span key
        run: tools/check_no_semantic_name_lookup.py --check
