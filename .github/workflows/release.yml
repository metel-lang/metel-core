name: Release

# Stage A of the release chain described in RELEASING.md: a release tag here bumps
# metel-website's docs pointer to metel-core's own pinned `docs` (metel-docs) commit,
# cuts a new docs version + tag in metel-website, and lets that tag trigger
# metel-website's own build-and-deploy workflow (Stage B).
#
# ADR-0051 removed a step that used to live here: metel-docs was a mirror of
# metel-docs-internal/public/, synced on every release. metel-docs is now the
# directly-edited source, so there is nothing left to sync -- metel-website's docs
# pointer bumps straight to whatever commit metel-core's own `docs` submodule is
# already pinned to.
#
# Each step below writes to exactly one other repo, using a token scoped to that repo
# alone -- no single credential spans all three. See RELEASING.md for the full
# rationale and the exact secrets this needs.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  # Gates both jobs below on the one check that actually determines whether this
  # tag is a real, publishable release (metel-core#681): a still-"in progress"
  # changelog. Before this job existed, that check lived only in github-release,
  # and release-chain had no dependency on it -- so a tag pushed before the
  # changelog was finalized still got a real commit + tag on metel-docs and
  # metel-website, even though github-release correctly refused to publish a
  # GitHub Release for the same tag. Nothing writes to another repository, or
  # builds anything, until this passes.
  validate-release:
    name: Validate the release is ready to publish
    runs-on: ubuntu-latest
    steps:
      # `docs` (ADR-0051) is the public `metel-docs` repo -- a plain,
      # unauthenticated HTTPS submodule checkout works, no token needed.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Derive the release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Same check github-release runs on its own copy of the changelog before
      # building -- duplicated rather than shared via an artifact, since it's a
      # few lines with no side effects and this way each job stays independently
      # runnable. Failing loudly on a still-"In progress" section catches exactly
      # the mistake /cut-release's own Step 2.1 exists to prevent (tagging before
      # finalizing the changelog).
      - name: Extract this version's changelog section
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PYEOF'
          import re, sys
          version = sys.argv[1]
          text = open("docs/release-notes/changelog.md").read()
          pattern = rf"^## v{re.escape(version)}\n(.*?)(?=^## v|\Z)"
          m = re.search(pattern, text, re.DOTALL | re.MULTILINE)
          if not m:
              sys.exit(f"no changelog section found for v{version}")
          body = m.group(1).strip()
          if body.startswith("**In progress"):
              sys.exit(f"changelog for v{version} is still marked in-progress -- finalize it before tagging")
          PYEOF

  release-chain:
    name: Bump website docs pointer, cut website release
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      # `docs` (ADR-0051) is the public `metel-docs` repo -- a plain,
      # unauthenticated HTTPS submodule checkout works, no token needed.
      - name: Checkout metel-core at the release tag
        uses: actions/checkout@v4
        with:
          submodules: true

      # docs/internal/versioning.md: "patch > 0 always means the spec is unchanged
      # from the .0 release of that minor version." A patch's docs are therefore
      # identical, by definition, to the minor version it patches -- cutting a new
      # Docusaurus versioned-docs snapshot for one is pure duplication of the last
      # minor's snapshot, not a new artifact. v0.12.1 did this: its versioned-docs
      # tree came back byte-identical to v0.12.0's. is_minor gates the
      # version-cutting steps below; every release still gets its docs pointer
      # bumped and the site redeployed, a patch just doesn't also freeze a new
      # `versioned_docs/version-X.Y.Z/` copy of what a reader already has under
      # the prior minor's version.
      - name: Derive the release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *.0 ]]; then
            echo "is_minor=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_minor=false" >> "$GITHUB_OUTPUT"
          fi

      # A distinct bot identity (e.g. metel-release-bot@users.noreply.github.com)
      # was tried first and doesn't work here: Vercel's Hobby plan checks the git
      # commit author against the account's own recognized email for deploy
      # authorization on a private, org-owned repo -- an unrecognized author
      # blocks the deploy with "did not have contributing access to the project
      # on Vercel." Found the hard way testing this chain end-to-end. Using the
      # real, Vercel-linked email instead; the commit messages themselves already
      # say "Automated by metel-core's release.yml" so it's not misattributed in
      # substance, just in the raw git author field.
      - name: Configure commit identity
        run: |
          git config --global user.name "Vlad Parfeniuc"
          git config --global user.email "vladislavparfeniuc@gmail.com"

      # ── Read the docs commit this release actually ships against ──
      #
      # ADR-0051: metel-docs is directly edited now, nothing to sync. Reading
      # metel-core's own pinned submodule commit (rather than resolving
      # metel-docs main independently, which the old sync step did) guarantees
      # the spec content this release's own tests ran against and the spec
      # content the website shows for it are the literal same commit, not two
      # independently-resolved reads of a moving target.
      - name: Read the pinned docs submodule commit
        id: docs-sha
        run: echo "sha=$(git rev-parse HEAD:docs)" >> "$GITHUB_OUTPUT"

      # ── Bump metel-website's docs pointer, cut a new docs version, tag ──
      - name: Checkout metel-website
        uses: actions/checkout@v4
        with:
          repository: metel-lang/metel-website
          token: ${{ secrets.WEBSITE_TOKEN }}
          path: metel-website
          submodules: true

      - name: Bump the docs submodule pointer to metel-core's pinned commit
        working-directory: metel-website
        run: |
          set -e
          cd docs
          git fetch origin main -q
          git checkout "${{ steps.docs-sha.outputs.sha }}" -q
          cd ..
          git add docs

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: metel-website/package-lock.json

      - name: Install website dependencies
        working-directory: metel-website
        run: npm ci

      # ADR-0064 / metel-core#1509: the Architecture Spec's evidence (links from each
      # requirement and limitation record to the code) is produced when documentation is
      # published, not stored in metel-docs. Render it into the docs working copy that the
      # snapshot below freezes, pinned to this release's tag. The generator is the one in the
      # pinned docs commit; `.` is this checkout of metel-core at the tag, which needs no
      # history (a shallow checkout is enough). A failure here stops the chain before the
      # website is tagged, so a broken generator never publishes empty evidence. A patch
      # cuts no snapshot (see above), so there is nothing to render for it.
      - name: Render the architecture evidence for the snapshot
        if: steps.version.outputs.is_minor == 'true'
        run: >-
          python3 metel-website/docs/architecture/tools/generate_architecture_evidence.py
          --core . --core-ref "$GITHUB_REF_NAME" --publish

      - name: Cut a new docs version
        if: steps.version.outputs.is_minor == 'true'
        working-directory: metel-website
        run: npm run docusaurus docs:version "${{ steps.version.outputs.version }}"

      - name: Commit the version bump
        working-directory: metel-website
        run: |
          set -e
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes for v${{ steps.version.outputs.version }} -- docs submodule pointer and docs:version output already up to date"
          elif [[ "${{ steps.version.outputs.is_minor }}" == "true" ]]; then
            git commit -q -m "release: v${{ steps.version.outputs.version }}

          Bumps the docs submodule pointer to metel-docs@${{ steps.docs-sha.outputs.sha }}
          and cuts a new versioned docs snapshot for this release. Automated by
          metel-core's release.yml (metel-core#614)."
            git push origin main
          else
            git commit -q -m "release: v${{ steps.version.outputs.version }}

          Bumps the docs submodule pointer to metel-docs@${{ steps.docs-sha.outputs.sha }}.
          A patch release changes no language-visible behavior (see
          docs/internal/versioning.md), so its docs are identical to the minor
          version it patches -- no new versioned-docs snapshot is cut. Automated
          by metel-core's release.yml (metel-core#614, metel-core#683)."
            git push origin main
          fi

      - name: Tag the website release
        working-directory: metel-website
        run: |
          set -e
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "$tag already exists on metel-website -- not re-tagging (this run is likely a retry)"
          else
            git tag "$tag"
            git push origin "$tag"
          fi

  # Independent of release-chain -- both depend only on validate-release above, not
  # on each other, so a failure in one doesn't block the other and neither delays
  # the other's expensive work (a full site build vs. a full cargo build) waiting
  # on something unrelated. Builds the metel binary and publishes a GitHub Release
  # for this repo's own tag, with its body sourced from the changelog -- previously
  # a fully manual step (/cut-release's Step 5.1). Needs only this repo's own
  # GITHUB_TOKEN (contents: write) -- unlike release-chain, nothing here writes to
  # another repository.
  github-release:
    name: Build binary and publish GitHub Release
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `docs` (ADR-0051) is the public `metel-docs` repo -- a plain,
      # unauthenticated HTTPS submodule checkout works, no token needed.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Derive the release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The changelog is already structured for exact extraction: "## vX.Y.Z"
      # headings, content running to the next "## v" heading or EOF. Failing loudly
      # on a still-"In progress" section catches exactly the mistake /cut-release's
      # own Step 2.1 exists to prevent (tagging before finalizing the changelog) --
      # without this check, an unfinalized changelog would silently become the
      # Release's public body text.
      - name: Extract this version's changelog section
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PYEOF'
          import re, sys
          version = sys.argv[1]
          text = open("docs/release-notes/changelog.md").read()
          pattern = rf"^## v{re.escape(version)}\n(.*?)(?=^## v|\Z)"
          m = re.search(pattern, text, re.DOTALL | re.MULTILINE)
          if not m:
              sys.exit(f"no changelog section found for v{version}")
          body = m.group(1).strip()
          if body.startswith("**In progress"):
              sys.exit(f"changelog for v{version} is still marked in-progress -- finalize it before tagging")
          open("release-notes.md", "w").write(body + "\n")
          PYEOF

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the release binary
        run: cargo build --release -p metel

      # Linux x86_64 only for now -- matches this runner, no cross-compilation. A
      # build matrix (macOS/Windows) is a natural, separate follow-up once this is
      # proven against a real release tag, not something to take on in the same
      # pass as getting the mechanism working at all.
      - name: Package the binary
        run: |
          cp target/release/metel metel-linux-x86_64
          sha256sum metel-linux-x86_64 > metel-linux-x86_64.sha256

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $tag already exists -- not re-creating (this run is likely a retry)"
          else
            gh release create "$tag" --title "$tag" --notes-file release-notes.md \
              metel-linux-x86_64 metel-linux-x86_64.sha256
          fi
