[package]
name = "metel"
version = "0.13.0"
edition = "2024"

[[bin]]
name = "metel"
path = "src/main.rs"

[dependencies]
metel-frontend = { path = "../metel-frontend" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Nicer error reporting with source context
clap = { version = "4.6.0", features = ["derive"] }
