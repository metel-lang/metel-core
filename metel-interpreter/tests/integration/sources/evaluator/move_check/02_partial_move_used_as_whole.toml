# RFC-0137 slice 2 (metel-core#858): a partial move now narrows `pair`'s type to
# `Pair.{ right }`, so `take(pair)` — which wants the whole `Pair` — is a plain
# type error at inference time, no longer only a `--move-check` finding.
[options]
error = ["T0001"]
move_check = true
spec = ["spec.ownership.partial-moves.legality-1", "spec.ownership.narrowing.legality-4"]

[expect]
status = "typecheck_error"
code = "T0001"
contains = "partially-moved `Pair`"
