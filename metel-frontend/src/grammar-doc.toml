# metel-core#720: the hand-maintained half of grammar.md's generation.
#
# Every rule in grammar.pest needs exactly one entry here -- gen_grammar
# fails the build otherwise, in both directions (a new pest rule with no
# entry; a stale entry naming a rule that no longer exists). This file
# decides display names and doc-section grouping, which is the only thing a
# rule's actual grammar.pest body can never tell you -- it does NOT decide
# whether a rule's *productions* are correct; those are always generated
# from grammar.pest directly and can't drift from it.
#
# mode = "named"    -- a real documented production: `name`, grouped under
#                       `section`. Section order in the generated doc is the
#                       order sections first appear below; rule order within
#                       a section is the order those rules appear below.
# mode = "terminal" -- an opaque named token (IDENTIFIER, INT, ...): has a
#                       `name` used at reference sites, but never its own
#                       line -- spelling out a lexical scan character by
#                       character isn't useful to a grammar reader.
# mode = "inline"   -- pure indirection or a trivial one-line wrapper: gets
#                       substituted by its own real pest body wherever
#                       referenced, recursively. No `name`/`section`.
# mode = "literal"  -- like inline, but the substituted text is `values`
#                       (joined as `"a" | "b"`) instead of the rule's real
#                       body -- for the keyword atoms whose actual body is
#                       `"kw" ~ !(ASCII_ALPHANUMERIC | "_")`: that trailing
#                       word-boundary lookahead is lexing plumbing, not
#                       grammar information, and there's no way to derive
#                       "strip exactly this shape" mechanically without
#                       risking silently mishandling a rule that isn't
#                       actually shaped that way. An explicit override says
#                       exactly what renders, still checked at the same
#                       completeness gate as every other mode.
# mode = "omit"     -- pest-internal plumbing (whitespace/comment handling,
#                       an interpolation sub-scanner): must never actually be
#                       reached while rendering a documented rule's body --
#                       gen_grammar fails the build if one is, rather than
#                       silently rendering it.

# ── Whitespace and comments -- pure pest plumbing, never documented ──────────

[[rule]]
pest = "WHITESPACE"
mode = "omit"
[[rule]]
pest = "COMMENT"
mode = "omit"
[[rule]]
pest = "line_comment"
mode = "omit"
[[rule]]
pest = "block_comment"
mode = "omit"

