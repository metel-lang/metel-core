[package]
name = "metel-frontend"
version = "0.13.0"
edition = "2024"
build = "build.rs"

[dependencies]
pest = "2"
pest_derive = "2"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Both used only by src/bin/gen_grammar.rs (metel-core#720), not the library
# itself -- real dependencies rather than dev-dependencies because a plain
# `cargo build --bin gen_grammar` doesn't link dev-dependencies.
pest_meta = "2.9.0"
toml = "1.1.5"
